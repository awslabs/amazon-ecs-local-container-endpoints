queue_rules:
  - name: Merge for developers
    queue_conditions:
      - base~=(mainline|rename-commands)
      - "#approved-reviews-by>=2"
      - approved-reviews-by=@awslabs/developer-experience
      - -approved-reviews-by~=author
      - -label~=(WIP|do-not-merge)
      - -title~=(WIP|wip)
      - -merged
      - -closed
      - author!=dependabot[bot]
    merge_conditions: []
    commit_message_template: |
      {{ title }} (#{{ number }})

      {{ body }}
    merge_method: squash
  - name: Merge for bots
    queue_conditions:
      - base=mainline
      - "#approved-reviews-by>=1"
      - "#changes-requested-reviews-by=0"
      - author=dependabot[bot]
      - -title~=(WIP|wip)
      - -label~=(WIP|do-not-merge)
      - -merged
      - -closed
    merge_conditions: []
    commit_message_template: |
      {{ title }} (#{{ number }})

      {{ body }}
    merge_method: squash

pull_request_rules:
  - name: Merge for bots
    conditions:
      - base=mainline
      - "#approved-reviews-by>=1"
      - "#changes-requested-reviews-by=0"
      - author=dependabot[bot]
      - -title~=(WIP|wip)
      - -label~=(WIP|do-not-merge)
      - -merged
      - -closed
    actions:
      review:
        type: APPROVE
  - name: Merge for bots + Merge for developers
    conditions: []
    actions:
      queue:
